spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/micrometer_test
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: metrics,health,info
  endpoint:
    metrics:
      enabled: true